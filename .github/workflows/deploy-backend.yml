name: Deploy Backend

# Gated on CI: `paths` stays native (range-aware across multi-commit pushes,
# and each workflow still lists its own file so Invariant 9 holds literally).
# The first real step waits for the CI run on this exact commit (`$GITHUB_SHA`)
# and fails the job if it isn't found within a bounded timeout or doesn't
# conclude with `success` — so a red, cancelled, or still-pending CI run blocks
# the deploy instead of racing it. `concurrency` serializes deploys instead of
# cancelling one mid-flight. workflow_dispatch is kept for manual runs
# (Invariant 9) but only from main.
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fd32026d220617d20fb552d13fb82abd
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI to pass on this commit
        run: |
          set -euo pipefail
          FIND_TIMEOUT=900
          INTERVAL=10
          ELAPSED=0
          RUN_ID=""
          echo "Looking for a CI run on $GITHUB_SHA..."
          while [ -z "$RUN_ID" ]; do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --branch main --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              break
            fi
            if [ "$ELAPSED" -ge "$FIND_TIMEOUT" ]; then
              echo "::error::No CI run found for commit $GITHUB_SHA within ${FIND_TIMEOUT}s"
              exit 1
            fi
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Found CI run $RUN_ID for $GITHUB_SHA — waiting for it to finish..."
          if ! timeout 1200 gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status; then
            echo "::error::CI run $RUN_ID for commit $GITHUB_SHA did not conclude with success"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @harfhane/shared run build

      - name: Capture current deployed version
        id: predeploy
        working-directory: apps/backend
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(pnpm exec wrangler versions list --json | jq -r '.[0].id // empty')
          echo "Current live version: ${CURRENT_VERSION:-<none>}"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        working-directory: apps/backend
        run: pnpm exec wrangler deploy --var GIT_SHA:"$GITHUB_SHA"

      - name: Smoke test production
        id: smoke
        run: |
          set -euo pipefail
          BODY=$(curl -sS --retry 5 --retry-delay 5 --retry-all-errors --max-time 15 "https://api.harfhane.app/api/health")
          echo "Response: $BODY"
          VERSION=$(echo "$BODY" | jq -r '.data.version // empty')
          if [ "$VERSION" != "$GITHUB_SHA" ]; then
            echo "::error::Smoke test failed: expected version $GITHUB_SHA, got '$VERSION'"
            exit 1
          fi

      - name: Roll back failed deploy
        if: failure() && steps.smoke.conclusion == 'failure'
        working-directory: apps/backend
        run: |
          set -euo pipefail
          PREV_VERSION="${{ steps.predeploy.outputs.version }}"
          if [ -z "$PREV_VERSION" ]; then
            echo "::error::Smoke test failed for $GITHUB_SHA and no prior version was captured to roll back to. Manual intervention required immediately."
            exit 1
          fi
          echo "::warning::Smoke test failed for $GITHUB_SHA — rolling back to $PREV_VERSION"
          if pnpm exec wrangler rollback "$PREV_VERSION" --message "Automatic rollback: smoke test failed for $GITHUB_SHA" --yes; then
            echo "::error::Deploy of $GITHUB_SHA failed its smoke test and was rolled back to $PREV_VERSION. Investigate before re-deploying."
          else
            echo "::error::Deploy of $GITHUB_SHA failed its smoke test AND automatic rollback to $PREV_VERSION failed. Manual intervention required immediately."
          fi
          exit 1
