name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# On main, deploy-*.yml waits for the CI run matching its exact commit SHA.
# A shared-per-ref group would let a newer queued push cancel an older
# pending run on main, leaving that commit's deploy waiting on a run that
# was cancelled instead of concluding — so main gets a unique group per
# commit (never cancelled); PRs keep one group per ref with cancellation.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @harfhane/shared run build

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm typecheck:test

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check acceptance-example coverage
        run: pnpm run check:ac

      - name: Build frontend
        run: pnpm --filter @harfhane/frontend run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('apps/frontend/package.json') }}

      - name: Install Playwright Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @harfhane/frontend exec playwright install chromium

      - name: Install Playwright OS dependencies
        run: pnpm --filter @harfhane/frontend exec playwright install-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          retention-days: 7

  words:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/words/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/words/requirements.txt

      - name: Test word pipeline
        run: python -m unittest discover -s scripts/words -p 'test_*.py'
