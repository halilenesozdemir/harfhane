name: Mutation testing

# Plan 009 U6 (docs/plans/2026-10-06-009-test-e2e-quality-gates-plan.md), owner
# decision 2026-10-10: the mutation gate (R7, AE6) normally runs locally
# (`pnpm run test:mutation`) before a PR touching packages/shared/src or
# apps/backend/src/{services,repositories} is marked ready, with the score in
# the PR body. This job exists only for a manual, on-demand run — it never
# runs on pull_request or push, so it does not add to the per-PR Actions
# minutes budget.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run changed-files mutation testing
        run: pnpm run test:mutation
