name = "harfhane-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "harfhane"
database_id = "58cbee2e-aa45-4b66-90c7-f5daa798f5e5"
migrations_dir = "db/migrations"

[vars]
PLAYABLE_WORD_LENGTHS = "5"

[[routes]]
pattern = "api.harfhane.app/*"
zone_name = "harfhane.app"

[triggers]
crons = ["0 17 * * *"]

[dev]
port = 8787
local_protocol = "http"
