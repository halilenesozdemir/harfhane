appId: host.exp.exponent
---
# Launches Expo Go with a clean app state and opens the Metro bundle for this project.
# Expo Go shows a one-time developer-menu bottom sheet on a fresh connection; "Continue" opens
# the full dev menu panel instead of dismissing it, so a hardware back closes that panel too.
- launchApp:
    clearState: true
- openLink: "exp://127.0.0.1:8081"
# The first bundle load after a clean state can be slow; this wait is optional so a slow
# load (or no dev-menu sheet at all) never fails the flow outright.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - back
# Plan 011 U7d: the cold-start launch intro covers the whole screen (How to play included;
# AppNavigator is hidden from accessibility while it plays), so every flow built on this subflow
# must wait it out before touching anything underneath it.
- extendedWaitUntil:
    notVisible: { id: "launch-intro" }
    timeout: 10000
# 011-AE5: a cleared app state has never seen How to play, so it opens before
# home on every fresh launch. Dismiss it with its first-launch "Oyna" action
# so every flow built on this subflow still lands on home as before.
- extendedWaitUntil:
    visible: "Nasıl Oynanır?"
    timeout: 15000
- tapOn: "Oyna"
- extendedWaitUntil:
    visible: { id: "home-hero" }
    timeout: 15000
